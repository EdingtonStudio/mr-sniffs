<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mr. Sniff's — Shop preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800;900&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap');
  :root {
    --color-midnight:#0F1214; --color-iron:#9A9EA0; --color-white:#FFF;
    --color-tag-burn-notice:#E06666; --color-tag-happy-ending:#8FAD45;
    --color-hairline:rgba(154,158,160,0.24);
    --font-headline:'Big Shoulders Display',sans-serif; --font-mono:'Space Mono',monospace; --font-body:'Inter',sans-serif;
    --weight-display:800; --tracking-label:0.12em; --tracking-display:0.01em; --max-width:1280px;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--color-midnight); color:var(--color-white); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  img { display:block; max-width:100%; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; border:0; background:none; cursor:pointer; }

  .nav { position:sticky; top:0; z-index:20; background:var(--color-midnight); border-bottom:1px solid var(--color-hairline); }
  .nav-inner { max-width:var(--max-width); margin:0 auto; padding:0.95rem clamp(1.25rem,4vw,3.5rem); display:flex; align-items:center; justify-content:space-between; gap:1.5rem; }
  .logo img { height:52px; width:auto; }
  .links { display:flex; align-items:center; gap:clamp(1rem,2.5vw,2.25rem); font-family:var(--font-mono); font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; }
  .links a { color:var(--color-white); opacity:0.8; padding-bottom:2px; border-bottom:1px solid transparent; transition:opacity 120ms,border-color 120ms; }
  .links a:hover { opacity:1; border-bottom-color:var(--color-white); }
  .cart { color:var(--color-white); opacity:0.8; font-family:var(--font-mono); font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; }
  .count { color:var(--color-iron); }

  .header { max-width:var(--max-width); margin:0 auto; padding:clamp(2.5rem,6vw,5rem) clamp(1.25rem,4vw,3.5rem) 0; }
  .kicker { margin:0 0 0.75rem; font-family:var(--font-mono); font-size:0.8rem; letter-spacing:var(--tracking-label); text-transform:uppercase; color:var(--color-iron); }
  .title { margin:0; font-family:var(--font-headline); font-weight:var(--weight-display); font-size:clamp(2.75rem,8vw,6rem); line-height:0.92; letter-spacing:var(--tracking-display); text-transform:uppercase; }

  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(1.25rem,4vw,3rem); max-width:var(--max-width); margin:0 auto; padding:clamp(2rem,5vw,4rem) clamp(1.25rem,4vw,3.5rem); }
  .grid > :nth-child(2) { margin-top:clamp(1.5rem,5vw,4.5rem); }

  .card { display:block; --card-accent:var(--color-iron); color:var(--color-white); }
  .media { position:relative; aspect-ratio:4/5; }
  .frame { position:absolute; inset:0; overflow:hidden; background:#17191b; border:1px solid var(--color-hairline); border-radius:8px; transition:border-color 200ms ease; }
  .card:hover .frame { border-color:var(--card-accent); }
  .frame img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform 400ms cubic-bezier(0.2,0.7,0.2,1); }
  .card:hover .frame img { transform:scale(1.03); }
  .tag { position:absolute; z-index:2; top:20px; left:-10px; width:33%; height:auto; transition:transform 220ms ease; pointer-events:none; }
  .card:hover .tag { transform:translateY(-3px); }
  .meta { display:flex; justify-content:flex-end; margin-top:0.9rem; }
  .price { font-family:var(--font-mono); font-size:0.9rem; color:var(--color-white); white-space:nowrap; }

  @media (max-width:640px){ .grid { grid-template-columns:1fr; } .grid > :nth-child(2){ margin-top:0; } }
</style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="#"><img src="public/brand/MrSniffs-Logo-white.svg" alt="Mr. Sniff's" /></a>
      <div class="links">
        <a href="#">Shop</a><a href="#">Smell Test</a><a href="#">About</a>
        <button class="cart" type="button">Cart <span class="count">(0)</span></button>
      </div>
    </div>
  </nav>

  <header class="header">
    <p class="kicker">The whole line</p>
    <h1 class="title">Two Scents.<br />Zero Chill.</h1>
  </header>

  <div class="grid">
    <a class="card" href="#" style="--card-accent:var(--color-tag-burn-notice)">
      <div class="media">
        <div class="frame"><img src="public/photos/card-burn-notice.jpg" alt="Burn Notice incense" /></div>
        <img class="tag" src="public/brand/tag-burn-notice.png" alt="Burn Notice" />
      </div>
      <div class="meta"><span class="price">$24</span></div>
    </a>

    <a class="card" href="#" style="--card-accent:var(--color-tag-happy-ending)">
      <div class="media">
        <div class="frame"><img src="public/photos/card-happy-ending.jpg" alt="Happy Ending incense" /></div>
        <img class="tag" src="public/brand/tag-happy-ending.png" alt="Happy Ending" />
      </div>
      <div class="meta"><span class="price">$24</span></div>
    </a>
  </div>
</body>
</html>
