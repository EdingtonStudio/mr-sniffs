<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mr. Sniff's — Hero preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800;900&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --color-midnight: #0F1214;
    --color-iron: #9A9EA0;
    --color-white: #FFFFFF;
    --color-tag-burn-notice: #E06666;
    --color-accent: #8FAD45;
    --color-hairline: rgba(154,158,160,0.24);
    --font-headline: 'Big Shoulders Display', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --font-body: 'Inter', sans-serif;
    --weight-headline: 800;
    --weight-headline-max: 900;
    --tracking-display: 0.01em;
    --tracking-label: 0.12em;
    --max-width: 1280px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--color-midnight); color: var(--color-white); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; border: 0; background: none; cursor: pointer; }

  /* NAV */
  .nav { position: sticky; top: 0; z-index: 20; background: var(--color-midnight); border-bottom: 1px solid var(--color-hairline); }
  .nav-inner { max-width: var(--max-width); margin: 0 auto; padding: 0.95rem clamp(1.25rem,4vw,3.5rem); display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; }
  .logo img { height: 52px; width: auto; }
  .links { display: flex; align-items: center; gap: clamp(1rem,2.5vw,2.25rem); font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .links a { color: var(--color-white); opacity: 0.8; padding-bottom: 2px; border-bottom: 1px solid transparent; transition: opacity 120ms, border-color 120ms; }
  .links a:hover { opacity: 1; border-bottom-color: var(--color-white); }
  .cart { color: var(--color-white); opacity: 0.8; text-transform: uppercase; letter-spacing: 0.1em; font-family: var(--font-mono); font-size: 0.8rem; }
  .cart:hover { opacity: 1; }
  .count { color: var(--color-iron); }

  /* HERO */
  .hero { position: relative; background: var(--color-midnight); overflow: hidden; min-height: calc(100vh - 58px); display: flex; align-items: center; }
  .inner { position: relative; width: 100%; max-width: var(--max-width); margin: 0 auto; padding: clamp(2rem,6vw,5rem) clamp(1.25rem,4vw,3.5rem); }
  .content { position: relative; z-index: 2; max-width: 66%; }
  .headline { margin: 0; font-family: var(--font-headline); font-weight: 800; font-size: clamp(3.25rem,10vw,9rem); line-height: 0.9; letter-spacing: var(--tracking-display); text-transform: uppercase; white-space: nowrap; animation: heroRise 900ms cubic-bezier(0.2,0.7,0.2,1) both; }
  .line { display: block; }
  .label { margin: clamp(1.75rem,4vw,2.75rem) 0 1.15rem; font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--color-iron); }
  .cta-row { display: flex; align-items: center; gap: clamp(1.25rem,3vw,2.5rem); flex-wrap: wrap; }
  .order-btn { display: inline-block; padding: 0.7em 1.4em; font-family: var(--font-headline); font-weight: var(--weight-headline); font-size: 1.4rem; text-transform: uppercase; letter-spacing: 0.02em; color: var(--color-midnight); background: var(--color-white); transition: transform 150ms, background 150ms, color 150ms; }
  .order-btn:hover { transform: translateY(-2px); background: var(--color-tag-burn-notice); color: var(--color-white); }
  .smell { display: inline-flex; align-items: center; gap: 0.6rem; }
  .mascot { width: clamp(46px,5vw,60px); height: auto; transform: rotate(-4deg); transform-origin: bottom center; animation: mascotBob 4s ease-in-out infinite; }
  .smell-label { font-family: var(--font-headline); font-weight: var(--weight-headline); font-size: 1.2rem; line-height: 1; text-transform: uppercase; border-bottom: 2px solid var(--color-accent); padding-bottom: 3px; }
  .photo { position: absolute; z-index: 1; top: 0; right: 0; bottom: 0; width: clamp(280px,42%,560px); overflow: hidden; border-radius: 8px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 62%; }
  .photo-fade { position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, var(--color-midnight) 0%, rgba(15,18,20,0.55) 18%, rgba(15,18,20,0) 44%); }

  @keyframes heroRise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes mascotBob { 0%,100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(-1deg) translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .headline, .mascot { animation: none; } }

  @media (max-width: 820px) {
    .hero { min-height: auto; }
    .content { max-width: 100%; }
    .headline { white-space: normal; font-size: clamp(3rem,14vw,5rem); }
    .photo { position: relative; top: auto; right: auto; bottom: auto; width: auto; height: 320px; margin-top: 2rem; }
    .photo-fade { display: none; }
  }
</style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="#" aria-label="Mr. Sniff's — home"><img src="public/brand/MrSniffs-Logo-white.svg" alt="Mr. Sniff's" /></a>
      <div class="links">
        <a href="#">Shop</a>
        <a href="#">Smell Test</a>
        <a href="#">About</a>
        <button class="cart" type="button">Cart <span class="count">(0)</span></button>
      </div>
    </div>
  </nav>

  <section class="hero" aria-label="Mr. Sniff's — come get a whiff">
    <div class="inner">
      <div class="photo">
        <img src="public/photos/hero-burn-notice.jpg" alt="Burn Notice incense, lit and smoking against a dark backdrop" />
        <span class="photo-fade" aria-hidden="true"></span>
      </div>
      <div class="content">
        <h1 class="headline">
          <span class="line">Come Get</span>
          <span class="line">A Whiff</span>
        </h1>
        <p class="label">Handcrafted incense · 2 scents, zero chill</p>
        <div class="cta-row">
          <a href="#" class="order-btn">Order Now</a>
          <a href="#" class="smell">
            <img class="mascot" src="public/brand/MrSniffs-Mascot-white.svg" alt="" aria-hidden="true" />
            <span class="smell-label">Take the Smell Test</span>
          </a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
